name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  CARGO_BUILD_JOBS: "4"
  # Pull requests use the sampled corpus for the per-profile properties.
  CHPLFMT_FULL_CORPUS: ${{ github.event_name != 'pull_request' && '1' || '0' }}
  # Cap on files taken from $CHPL_HOME/test, when the image has it.
  CHPLFMT_CORPUS_TEST_MAX: "4000"

jobs:
  images:
    name: Resolve image digests
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.resolve.outputs.digests }}
    steps:
      - id: resolve
        run: |
          json="{}"
          for tag in 2.10.0 latest nightly; do
            digest=$(docker buildx imagetools inspect "chapel/chapel:$tag" \
              --format '{{json .Manifest}}' | jq -r .digest)
            echo "chapel/chapel:$tag -> $digest"
            json=$(jq -c --arg t "$tag" --arg d "$digest" '. + {($t): $d}' <<<"$json")
          done
          echo "digests=$json" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and type check
    needs: images
    runs-on: ubuntu-latest
    container:
      image: chapel/chapel:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: "3.12"
          image-digest: ${{ fromJSON(needs.images.outputs.digests).latest }}
      - run: ruff check .
      - run: black --check .
      - run: pyright
      - run: python native/tools/gen_width_table.py --check
      - run: cargo fmt --manifest-path native/Cargo.toml --all --check
      - run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings

  native-tests:
    name: Native Rust tests
    needs: images
    runs-on: ubuntu-latest
    container:
      image: chapel/chapel:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: "3.12"
          image-digest: ${{ fromJSON(needs.images.outputs.digests).latest }}
      - run: cargo test --manifest-path native/Cargo.toml -p chplfmt-core --all-targets

  native-smoke:
    name: Native wheel smoke (no chapel-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: astral-sh/setup-uv@v6
      - name: Build abi3 wheel
        run: |
          uv python install 3.12
          uvx maturin build --manifest-path native/py/Cargo.toml --release --interpreter "$(uv python find 3.12)" --out "$RUNNER_TEMP/wheels"
          wheel=("$RUNNER_TEMP"/wheels/chplfmt-*-cp312-abi3-*.whl)
          test -f "${wheel[0]}"
          echo "WHEEL=${wheel[0]}" >> "$GITHUB_ENV"
        shell: bash
      - name: Test wheel without Chapel
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" "$WHEEL" pytest pytest-xdist
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest -q -n 4 -m native \
            tests/unit/test_config.py tests/unit/test_doc_render.py \
            tests/unit/test_lexer.py tests/unit/test_native_doc.py \
            tests/unit/test_source.py

  test:
    name: Tests (Chapel ${{ matrix.chapel }}, Python ${{ matrix.python }})
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chapel: ["2.10.0", latest, nightly]
        python: ["3.12", "3"] # minimum supported and latest 3.x
    container:
      image: chapel/chapel:${{ matrix.chapel }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}
          image-digest: ${{ fromJSON(needs.images.outputs.digests)[matrix.chapel] }}
      - name: Unit tests
        run: python -m pytest -q -n 4 -m "not corpus and not perf" tests/unit
      - name: Golden and option tests
        run: python -m pytest -q -n 4 tests/golden tests/options

  corpus:
    name: Corpus ${{ matrix.shard }}/3 (Chapel ${{ matrix.chapel }}, Python ${{ matrix.python }})
    needs: [images, test]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chapel: ["2.10.0", latest, nightly]
        python: ["3.12", "3"]
        shard: [1, 2, 3]
    container:
      image: chapel/chapel:${{ matrix.chapel }}
      options: --user root
    env:
      CHPLFMT_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}
          image-digest: ${{ fromJSON(needs.images.outputs.digests)[matrix.chapel] }}
      - name: Corpus
        run: |
          echo "CHPL_HOME=$CHPL_HOME"
          ls -d "$CHPL_HOME/modules" "$CHPL_HOME/test" 2>/dev/null || true
      - name: Corpus properties
        run: >
          python -m pytest -q -n 4 -m corpus tests/properties
          --ignore=tests/properties/test_corpus_coverage.py
      - name: Coverage gate (no printer fallbacks)
        run: python -m pytest -q -n 4 tests/properties/test_corpus_coverage.py
      - name: Performance smoke test
        if: matrix.shard == 1
        run: python -m pytest -q -s -m perf tests/unit
