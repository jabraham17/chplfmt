name: Set up chplfmt
description: >
  Inside a chapel/chapel container: install Python with uv, install chplfmt
  with its dev dependencies, and make sure chapel-py is importable (building it
  with `make chapel-py-venv`, cached by image digest, if the image lacks it).
inputs:
  python:
    description: Python version request for `uv python install`
    required: true
  image-digest:
    description: Digest of the Chapel image, for the chapel-py cache key
    required: true
runs:
  using: composite
  steps:
    - name: Export CHPL_HOME
      shell: bash
      run: |
        home="${CHPL_HOME:-$(chpl --print-chpl-home 2>/dev/null | awk '{print $1}')}"
        test -n "$home" && test -d "$home" || { echo "::error::CHPL_HOME not found"; exit 1; }
        echo "CHPL_HOME=$home" >> "$GITHUB_ENV"
        chpl --version | head -1

    - uses: astral-sh/setup-uv@v6

    - name: Install Python ${{ inputs.python }} and chplfmt
      shell: bash
      run: |
        uv python install "${{ inputs.python }}"
        uv venv --python "${{ inputs.python }}" .venv
        uv pip install --python .venv -e '.[dev]'
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        .venv/bin/python --version

    - name: Probe chapel-py
      id: probe
      shell: bash
      run: |
        chplcheck --version || echo "chplcheck not available"
        if .venv/bin/python -c "import chplfmt._chapel"; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore chapel-py
      id: cache
      if: steps.probe.outputs.ok != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CHPL_HOME }}/third-party/chpl-venv/install
        key: chapel-py-${{ inputs.image-digest }}

    - name: Build chapel-py
      if: steps.probe.outputs.ok != 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: make -C "$CHPL_HOME" -j4 chapel-py-venv

    - name: Save chapel-py
      if: steps.probe.outputs.ok != 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CHPL_HOME }}/third-party/chpl-venv/install
        key: chapel-py-${{ inputs.image-digest }}

    - name: Check chapel-py
      shell: bash
      run: .venv/bin/python -m chplfmt --version
