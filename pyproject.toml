[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chplfmt"
dynamic = ["version"]
description = "An opinionated source formatter for Chapel"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  # 1.7.3 is the first release whose TomlConfigParser uses the stdlib tomllib.
  "ConfigArgParse>=1.7.3,<2",
  "PyYAML>=6.0,<7",
  "pygls>=1.3,<2",
  "lsprotocol>=2023.0.1,<2024",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-xdist>=3",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "types-PyYAML>=6.0",
]

[project.scripts]
chplfmt = "chplfmt.cli:main"

[tool.hatch.version]
path = "src/chplfmt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chplfmt"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter handles line length.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
extraPaths = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = [
  "corpus: property tests over the Chapel corpus (slow)",
  "perf: performance smoke tests (timing-sensitive)",
]
