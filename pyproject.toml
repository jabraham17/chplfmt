[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "chplfmt"
dynamic = ["version"]
description = "An opinionated source formatter for Chapel"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  # 1.7.3 is the first release whose TomlConfigParser uses the stdlib tomllib.
  "ConfigArgParse>=1.7.3,<2",
  "PyYAML>=6.0,<7",
  "pygls>=1.3,<2",
  "lsprotocol>=2023.0.1,<2024",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-xdist>=3",
  "black>=24",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "types-PyYAML>=6.0",
]

[project.scripts]
chplfmt = "chplfmt.cli:main"

[tool.maturin]
python-source = "src"
module-name = "chplfmt._native"
manifest-path = "native/py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter handles line length.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
extraPaths = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = [
  "corpus: property tests over the Chapel corpus (slow)",
  "native: tests that run without chapel-py",
  "perf: performance smoke tests (timing-sensitive)",
  "memory: native-inclusive memory smoke tests (run serially)",
]
